name: CD

on:
  workflow_run:
    workflows: ["CI Pipeline PUKAY"] # Tiene que coincidir exactamente con el "name" del ci.yml
    types:
      - completed
    branches: [main]

permissions:
  contents: read

jobs:
  desplegar:
    name: desplegar
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && vars.URL_PRODUCCION != '' }}
    environment:
      name: production
      url: ${{ vars.URL_PRODUCCION }}
    steps:
      - name: Pedir el despliegue a Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail-with-body --silent --show-error -X POST "$RENDER_DEPLOY_HOOK"
